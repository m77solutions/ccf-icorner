name: Daily Rebuild (hide past months)
on:
  schedule:
    - cron: '5 16 * * *'   # 00:05 Asia/Manila
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build_and_deploy_job via repository_dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REBUILD_PAT }}
          event-type: refresh-events
          client-payload: '{"reason":"daily-month-rollover"}'
